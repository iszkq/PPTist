name: 发布本地插件安装包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 构建 Windows 安装包
        shell: pwsh
        run: ./desktop/installer/Build-PPTistSetup.ps1
      - name: 保存安装包构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PPTist-Setup
          path: desktop/release/PPTist-Setup.exe
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/PPTist-Setup.exe
          generate_release_notes: true
